services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logisly
      POSTGRES_PASSWORD: logisly
      POSTGRES_DB: logisly_ir
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logisly -d logisly_ir"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://logisly:logisly@postgres:5432/logisly_ir?schema=public
      API_ORIGIN: http://localhost:3001
      APP_ORIGIN: http://localhost:5173
      STORAGE_DIR: /app/storage
      PORT: "3001"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_ORIGIN: ""
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
