# Production: pull GHCR images. Set IMAGE_TAG (default main) and place .env next to this file.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logisly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-logisly_ir}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logisly} -d ${POSTGRES_DB:-logisly_ir}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/${GHCR_OWNER:-pandureynaldo}/logisly-ir-api:${IMAGE_TAG:-main}
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE_DIR: /app/storage
      PORT: "3001"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/${GHCR_OWNER:-pandureynaldo}/logisly-ir-web:${IMAGE_TAG:-main}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
